  <rect x="7" y="5" width="10" height="5" rx="1.3" style="fill:var(--accent,#2457D6)"/>
  <circle cx="8.8" cy="13.8" r="1.3" style="fill:var(--accent,#2457D6)"/>
  <circle cx="15.2" cy="13.8" r="1.3" style="fill:var(--accent,#2457D6)"/>
  <path d="M9 20L7 22.8M15 20L17 22.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>
